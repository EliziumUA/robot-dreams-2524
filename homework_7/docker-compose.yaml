# Specifies the version of Docker Compose syntax being used
version: '3.8'

# Defines the services that will be part of the Docker Compose setup
services:
  # Service for Loki, a log aggregation system
  loki:
    # Specifies the Docker image for Loki from Grafana, using the latest version
    image: grafana/loki:latest
    # Maps port 3100 on the host to port 3100 on the container (for accessing Loki API)
    ports:
      - "3100:3100"
    # Connects the Loki service to the 'my_network' network
    networks:
      - my_network

  # Service for Fluentd, configured to send logs to Loki
  fluentd-loki:
    # The build context directory for the Fluentd image
    build:
      context: ./fluentd-loki
      # Specifies the Dockerfile to be used for building the Fluentd image
      dockerfile: Dockerfile
    # Maps TCP port 24224 on the host to port 24224 on the container (for Fluentd input)
    ports:
      - "24224:24224"
      # Maps UDP port 24224 on the host to port 24224 on the container (for Fluentd input)
      - "24224:24224/udp"
    # Mounts a Fluentd configuration file from the host into the container
    volumes:
      - ./fluentd-loki/fluentd.conf:/fluentd/etc/fluent.conf:ro
    # Connects the Fluentd service to the 'my_network' network
    networks:
      - my_network
    # Ensures that the Loki service is started before Fluentd
    depends_on:
      - loki

  # A test container that generates logs for Fluentd to collect
  log_container_fluentd:
    # Uses the BusyBox image, which is a minimal Unix environment
    image: busybox
    # Generates a log message every 2 seconds
    command: "sh -c 'while true; do echo \"Fluentd test log: $(date)\"; sleep 2; done'"
    # Connects the log container to the 'my_network' network
    networks:
      - my_network
    # Configures the logging driver to Fluentd
    logging:
      driver: fluentd
      # Specifies the address of Fluentd to send logs to
      options:
        fluentd-address: localhost:24224
        # Assigns a tag to the logs generated by this container
        tag: log_container_fluentd.logs
    # Ensures Fluentd is running before this container
    depends_on:
      - fluentd-loki

  # Service for Grafana, the visualization tool for logs
  grafana:
    # Specifies the Docker image for Grafana
    image: grafana/grafana
    # Mounts the Grafana provisioning directory for dashboard configuration
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # Connects Grafana to the 'my_network' network
    networks:
      - my_network
    # Maps port 3030 on the host to port 3000 on the container (for Grafana web UI)
    ports:
      - "3030:3000"
    # Sets environment variables for Grafana configuration
    environment:
      # Sets the admin password for Grafana from an environment variable
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Sets the default dashboard path in Grafana
      - GF_DASHBOARD_DEFAULT_HOME_DASHBOARD_PATH=${GF_DASHBOARD_DEFAULT_HOME_DASHBOARD_PATH}
      # Sets the root URL for the Grafana server
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
    # Ensures that Loki is running before Grafana
    depends_on:
      - loki

# Defines a custom network named 'my_network'
networks:
  my_network:
    # Uses the 'bridge' driver for network communication between containers
    driver: bridge
