apiVersion: v1  # Specifies the API version being used for the resource
kind: Service  # Defines the resource type as a Service
metadata:  # Metadata section for the Service
  name: wordpress  # The name of the Service
  namespace: wordpress  # The namespace where this Service is created
spec:  # Specification section for the Service
  selector:  # Defines the selector to match the pods targeted by this Service
    app: wordpress  # The label used to select the WordPress pods
  ports:  # List of ports exposed by the Service
    - port: 80  # The port on which the Service will be accessible within the cluster
      targetPort: 80  # The port on the pod to which traffic will be forwarded
  type: ClusterIP  # The type of the Service (ClusterIP exposes it only within the cluster)
