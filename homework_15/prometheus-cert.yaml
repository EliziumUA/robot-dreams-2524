apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-cert
  namespace: monitoring
spec:
  secretName: prometheus-tls-secret
  duration: 2160h
  renewBefore: 360h
  commonName: prometheus.local
  dnsNames:
    - prometheus.local
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
