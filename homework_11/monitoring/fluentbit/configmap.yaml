apiVersion: v1  # Specifies the API version for the ConfigMap resource
kind: ConfigMap  # Defines the resource as a ConfigMap, used to store non-confidential configuration data
metadata:
  name: fluentbit-configmap  # The name of the ConfigMap, which can be referenced by other resources
  namespace: my-monitoring  # The namespace where the ConfigMap is stored
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
    [INPUT]
        Name              tail
        Path              /mnt/data/busybox-pv/busybox.log
        Parser            docker
        Tag               kube.*
        Refresh_Interval  5
    [OUTPUT]
        Name        loki
        Match       *
        Host        loki-service
        Port        3100
        Labels      job=busybox-logs
