apiVersion: v1  # Specifies the Kubernetes API version
kind: ConfigMap  # Defines the resource as a ConfigMap
metadata:
  name: busybox-configmap  # The name of the ConfigMap
  namespace: my-busybox  # The namespace where the ConfigMap is created
  labels:
    app: busybox-app  # A label to associate the ConfigMap with the busybox-app
data:
  FILE_NAME: "busybox.log"  # Key-value pair representing configuration data (filename for logs)
